<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT9020 Browser Test</title>

<style>
body {
    font-family: Arial, sans-serif;
    font-size: 16px;
    padding: 15px;
    background: #f5f5f5;
}

h2 {
    font-size: 20px;
}

.box {
    background: white;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 6px;
}

.label {
    font-weight: bold;
}

pre {
    white-space: pre-wrap;
    word-break: break-word;
}
</style>
</head>

<body>

<h2>📱 IT9020 Browser Test</h2>

<div class="box">
    <div class="label">Device:</div>
    <div id="device"></div>
</div>

<div class="box">
    <div class="label">Browser:</div>
    <div id="browser"></div>
</div>

<div class="box">
    <div class="label">Screen:</div>
    <div id="screen"></div>
</div>

<div class="box">
    <div class="label">Mobile / Desktop:</div>
    <div id="mobile"></div>
</div>

<div class="box">
    <div class="label">Cloud Phone:</div>
    <div id="cloud"></div>
</div>

<div class="box">
    <div class="label">User-Agent:</div>
    <pre id="ua"></pre>
</div>

<script>

const ua = navigator.userAgent;

document.getElementById("ua").textContent = ua;

document.getElementById("screen").textContent =
    screen.width + " × " + screen.height;

let isMobile =
    /Android|iPhone|iPad|Mobile|Mobi|KaiOS/i.test(ua);

document.getElementById("mobile").textContent =
    isMobile ? "📱 MOBILE" : "🖥️ DESKTOP";

let isCloud =
    /Cloud Phone|CloudPhone|Puffin/i.test(ua);

document.getElementById("cloud").textContent =
    isCloud ? "☁️ CLOUD PHONE DETECTED" :
              "❌ Cloud Phone not detected";

let browser = "Unknown";

if (/Chrome/i.test(ua)) browser = "Chrome";
if (/Firefox/i.test(ua)) browser = "Firefox";
if (/Safari/i.test(ua) && !/Chrome/i.test(ua))
    browser = "Safari";
if (/Puffin/i.test(ua))
    browser = "Puffin / Cloud Phone";

document.getElementById("browser").textContent = browser;

let device = "Unknown";

if (/Nokia/i.test(ua)) device = "Nokia";
if (/itel/i.test(ua)) device = "itel";
if (/Cloud Phone/i.test(ua)) device += " / Cloud Phone";

document.getElementById("device").textContent = device;

</script>

</body>
</html>
